<!DOCTYPE html><html lang="zh-CN"><head><meta name="generator" content="Hexo 3.8.0"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="author" content="WeAir"><link rel="alternative" href="/atom.xml" title="WeAir" type="application/atom+xml"><link rel="icon" href="/favicon.ico"><title>安装Many Notes - WeAir</title><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/js/fancybox/jquery.fancybox.min.css"><!--[if lt IE 9]><script>(function(a,b){a="abbr article aside audio bdi canvas data datalist details dialog figcaption figure footer header hgroup main mark meter nav output progress section summary template time video".split(" ");for(b=a.length-1;b>=0;b--)document.createElement(a[b])})()</script><![endif]--><script src="/js/jquery-3.1.1.min.js"></script><script src="/js/fancybox/jquery.fancybox.min.js"></script></head><body style="opacity:0"><header class="head"><h1 class="head-title u-fl"><a href="/">WeAir</a></h1><nav class="head-nav u-fr"><ul class="head-nav__list"><li class="head-nav__item"><a class="head-nav__link" href="/archives">カタログ/（目录）</a></li></ul></nav></header><main class="main"><article class="post"><header class="post__head"><time class="post__time" datetime="2026-07-03T04:00:00.000Z">July 3, 2026</time><h1 class="post__title"><a href="/install-many-notes/">安装Many Notes</a></h1><div class="post__main echo"><p><a href="https://github.com/brufdev/many-notes" target="_blank" rel="noopener">Many Notes</a>是一款主打极简风格的Markdown笔记Web应用，您可以轻松创建或导入个人笔记。</p>
<h3 id="准备"><a href="#准备" class="headerlink" title="准备"></a>准备</h3><p>提前安装Nginx及Docker，Docker的安装可以查阅<a href="https://weair.cc/install-vaultwarden/" title="安装">这里</a>。</p>
<h3 id="安装Many-Notes"><a href="#安装Many-Notes" class="headerlink" title="安装Many Notes"></a>安装Many Notes</h3><p>创建docker-compose.yml文件</p>
<figure class="highlight plain"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br></pre></td><td class="code"><pre><span class="line">services:</span><br><span class="line">  php:</span><br><span class="line">    image: brufdev/many-notes:latest</span><br><span class="line">    restart: unless-stopped</span><br><span class="line">    environment:</span><br><span class="line">      - APP_TIMEZONE=Asia/Shanghai</span><br><span class="line">      - APP_URL=https://domain.name</span><br><span class="line">      - MAIL_MAILER=smtp</span><br><span class="line">      - MAIL_HOST=smtp.domain.name</span><br><span class="line">      - MAIL_PORT=587</span><br><span class="line">      - MAIL_USERNAME=no-reply@domain.name</span><br><span class="line">      - MAIL_PASSWORD=mail_password</span><br><span class="line">      - MAIL_ENCRYPTION=STARTTLS</span><br><span class="line">      - MAIL_FROM_ADDRESS=no-reply@domain.name</span><br><span class="line">      - MAIL_FROM_NAME=&quot;Many Notes&quot;</span><br><span class="line">      - PHP_POST_MAX_SIZE=1G</span><br><span class="line">      - PHP_UPLOAD_MAX_FILE_SIZE=1G</span><br><span class="line">    volumes:</span><br><span class="line">      - ./database:/var/www/html/database/sqlite</span><br><span class="line">      - ./logs:/var/www/html/storage/logs</span><br><span class="line">      - ./private:/var/www/html/storage/app/private</span><br><span class="line">      - ./typesense:/var/www/html/typesense</span><br><span class="line">    ports:</span><br><span class="line">      - 8080:8080</span><br></pre></td></tr></table></figure>

<p>创建挂载目录并修改权限</p>
<figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">mkdir ./&#123;database,logs,private,typesense&#125;</span><br><span class="line">chown www-data:www-data ./&#123;database,logs,private,typesense&#125;</span><br></pre></td></tr></table></figure>

<p>启动服务</p>
<figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">docker compose up -d</span><br></pre></td></tr></table></figure>

<p>更多自定义配置可查询<a href="https://github.com/brufdev/many-notes#customization" title="配置" target="_blank" rel="noopener">这里</a>。</p>
<h3 id="配置Nginx反代"><a href="#配置Nginx反代" class="headerlink" title="配置Nginx反代"></a>配置Nginx反代</h3><figure class="highlight plain"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br></pre></td><td class="code"><pre><span class="line">server &#123;</span><br><span class="line">    listen 80;</span><br><span class="line">    listen [::]:80;</span><br><span class="line"></span><br><span class="line">    server_name domain.name;</span><br><span class="line"></span><br><span class="line">    return 301 https://$host$request_uri;</span><br><span class="line">&#125;</span><br><span class="line"></span><br><span class="line">server &#123;</span><br><span class="line">    listen 443 ssl;</span><br><span class="line">    listen [::]:443 ssl;</span><br><span class="line">    http2 on;</span><br><span class="line"></span><br><span class="line">    server_name domain.name;</span><br><span class="line"></span><br><span class="line">    ssl_certificate /path/key.crt;</span><br><span class="line">    ssl_certificate_key /path/cert.key;</span><br><span class="line"></span><br><span class="line">    location / &#123;</span><br><span class="line">        proxy_pass http://127.0.0.1:8080;</span><br><span class="line"></span><br><span class="line">        proxy_set_header Host $host;</span><br><span class="line">        proxy_set_header X-Real-IP $remote_addr;</span><br><span class="line">        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;</span><br><span class="line">        proxy_set_header X-Forwarded-Proto $scheme;</span><br><span class="line"></span><br><span class="line">        proxy_http_version 1.1;</span><br><span class="line">        proxy_set_header Upgrade $http_upgrade;</span><br><span class="line">        proxy_set_header Connection &quot;Upgrade&quot;;</span><br><span class="line"></span><br><span class="line">        proxy_connect_timeout 60s;</span><br><span class="line">        proxy_read_timeout    60s;</span><br><span class="line">        proxy_send_timeout    60s;</span><br><span class="line">    &#125;</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>
